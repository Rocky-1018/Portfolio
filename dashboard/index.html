<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#0F1417;
  --panel:#171F24;
  --panel-raised:#1D262C;
  --line:#2A343B;
  --ink:#E8EDF0;
  --muted:#8A98A3;
  --mint:#4FD1A5;
  --coral:#F2725A;
  --gold:#E3B341;
}
*{box-sizing:border-box;}
html,body{
  margin:0;height:100%;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ---- Login ---- */
.login-overlay{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.login-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:48px 44px;width:100%;max-width:460px;
}
.login-card h1{font-family:'Fraunces',serif;font-weight:500;font-size:32px;margin:0 0 8px;}
.login-card p{color:var(--muted);font-size:16px;margin:0 0 28px;}
.login-card .field{margin-bottom:20px;display:flex;flex-direction:column;gap:8px;}
.login-card label{font-size:14px;color:var(--muted);}
.login-card input{
  background:var(--panel-raised);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:14px 16px;font-size:18px;font-family:inherit;width:100%;
}
.login-card input:focus{outline:none;border-color:var(--mint);}
.login-btn{
  width:100%;margin-top:6px;background:var(--mint);color:#0B1512;border:none;
  border-radius:8px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.login-btn:hover{filter:brightness(1.08);}
.login-error{color:var(--coral);font-size:15px;margin-top:14px;min-height:20px;}

/* ---- Dashboard shell ---- */
.dash{
  display:none;
  height:100vh;width:100vw;
  padding:2.2vh 2.2vw;
  flex-direction:column;
  gap:1.8vh;
  position:relative;
  isolation:isolate;
}
.dash::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:-2;
  background-image:url('../assets/images/dashboard-background.png');
  background-size:cover;
  background-position:center;
}
.dash::after{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  background:linear-gradient(120deg,rgba(8,13,16,.78),rgba(8,13,16,.52) 58%,rgba(8,13,16,.68));
  pointer-events:none;
}
.dash-top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:1vh;}
.dash-top,.dash-quote,.dash-main{position:relative;z-index:1;}
.dash-top h1{
  font-family:'Fraunces',serif;font-weight:500;font-size:clamp(20px,2.4vw,34px);
  margin:0;letter-spacing:0.3px;
}
.dash-datetime{text-align:right;}
.dash-clock{
  font-family:'JetBrains Mono',monospace;font-weight:700;
  font-size:clamp(28px,4.4vw,64px);line-height:1;color:var(--mint);
}
.dash-date{color:var(--muted);font-size:clamp(13px,1.4vw,20px);margin-top:4px;}

.dash-quote{
  text-align:center;flex-shrink:0;padding:0.6vh 2vw;
  font-family:'Fraunces',serif;font-style:italic;color:var(--muted);
  font-size:clamp(14px,1.5vw,24px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.dash-quote .author{
  font-style:normal;font-family:'Inter',sans-serif;color:var(--gold);
  font-size:0.72em;margin-left:10px;
}

/* ---- At-a-glance insights ---- */
.dash-insights{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1vw;flex-shrink:0;
}
.dash-insight{
  min-width:0;padding:1.1vh 1.1vw;border-radius:12px;
  background:rgba(15,23,27,.82);border:1px solid rgba(126,150,162,.34);
  backdrop-filter:blur(8px);
}
.dash-insight-label{
  color:var(--muted);font-size:clamp(9px,.8vw,12px);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
}
.dash-insight-value{
  margin-top:3px;font-family:'JetBrains Mono',monospace;font-size:clamp(15px,1.5vw,23px);
  font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dash-insight-detail{
  margin-top:2px;color:var(--mint);font-size:clamp(9px,.78vw,12px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.dash-main{flex:1;display:flex;gap:1.8vw;min-height:0;}

/* ---- Calendar ---- */
.dash-cal{
  flex:2.15;background:rgba(23,31,36,.88);border:1px solid rgba(126,150,162,.38);border-radius:16px;
  padding:1.6vw;display:flex;flex-direction:column;min-height:0;min-width:0;
}
.dash-cal-title{
  font-family:'Fraunces',serif;font-size:clamp(16px,1.7vw,26px);font-weight:500;
  margin-bottom:1vh;flex-shrink:0;
}
.dash-cal-grid{
  flex:1;display:grid;grid-template-columns:repeat(7,1fr);
  grid-template-rows:auto repeat(6,1fr);gap:6px;min-height:0;
}
.dash-weekday{
  font-size:clamp(10px,0.85vw,15px);color:var(--muted);text-align:center;
  text-transform:uppercase;letter-spacing:0.6px;padding-bottom:4px;
}
.dash-day{
  background:var(--panel-raised);border:1px solid var(--line);border-radius:8px;
  padding:0.5vh 0.6vw;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:0;overflow:hidden;
}
.dash-day.empty{background:transparent;border-color:transparent;}
.dash-day.today{border-color:var(--gold);border-width:2px;background:rgba(227,179,65,0.08);}
.dash-day-num{
  font-family:'JetBrains Mono',monospace;font-size:clamp(11px,1.05vw,17px);color:var(--muted);
  flex-shrink:0;
}
.dash-day.today .dash-day-num{color:var(--gold);font-weight:700;}
.dash-day-events{display:flex;flex-direction:column;gap:2px;overflow:hidden;flex:1;min-height:0;}
.dash-evt{
  font-size:clamp(9px,0.78vw,13px);padding:1px 5px;border-radius:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(79,209,165,0.16);color:var(--mint);line-height:1.5;
}
.dash-day-more{font-size:clamp(9px,0.7vw,12px);color:var(--muted);}

/* ---- Agenda sidebar ---- */
.dash-agenda{
  flex:1;background:rgba(23,31,36,.88);border:1px solid rgba(126,150,162,.38);border-radius:16px;
  padding:1.6vw;display:flex;flex-direction:column;gap:2vh;min-height:0;min-width:0;overflow:hidden;
}
.dash-agenda-section{display:flex;flex-direction:column;min-height:0;}
.dash-agenda-section.today{flex:1.5;}
.dash-agenda-section.tomorrow{flex:1;}
.dash-agenda-h{
  font-size:clamp(11px,1vw,16px);text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin-bottom:1vh;flex-shrink:0;font-weight:600;
}
.dash-agenda-list{overflow:hidden;display:flex;flex-direction:column;gap:1vh;}
.dash-agenda-row{display:flex;gap:12px;align-items:baseline;}
.dash-agenda-time{
  font-family:'JetBrains Mono',monospace;color:var(--mint);flex-shrink:0;
  font-size:clamp(12px,1.1vw,19px);width:7em;white-space:nowrap;
}
.dash-agenda-title{
  font-size:clamp(13px,1.2vw,21px);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dash-empty{color:var(--muted);font-size:clamp(12px,1.1vw,18px);}

@media (max-width:720px){
  html,body{overflow:auto;}
  .dash{height:auto;min-height:100vh;}
  .dash-main{flex-direction:column;min-height:680px;}
  .dash-cal{min-height:500px;}
  .dash-insights{grid-template-columns:repeat(2,minmax(0,1fr));}
}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h1>Dashboard</h1>
    <p>Sign in to continue.</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUser" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="dash" id="dash">
  <div class="dash-top">
    <h1>Dashboard</h1>
    <div class="dash-datetime">
      <div class="dash-clock" id="clock">--:--</div>
      <div class="dash-date" id="dateLabel">—</div>
    </div>
  </div>

  <div class="dash-quote" id="quoteBar"></div>

  <div class="dash-insights" aria-label="Schedule summary">
    <div class="dash-insight">
      <div class="dash-insight-label">Today</div>
      <div class="dash-insight-value" id="todayCount">—</div>
      <div class="dash-insight-detail" id="todayDetail">Loading schedule</div>
    </div>
    <div class="dash-insight">
      <div class="dash-insight-label">Time blocked</div>
      <div class="dash-insight-value" id="timeBlocked">—</div>
      <div class="dash-insight-detail" id="timeBlockedDetail">Today’s meetings</div>
    </div>
    <div class="dash-insight">
      <div class="dash-insight-label">Next up</div>
      <div class="dash-insight-value" id="nextEvent">—</div>
      <div class="dash-insight-detail" id="nextEventDetail">No upcoming event</div>
    </div>
    <div class="dash-insight">
      <div class="dash-insight-label">This month</div>
      <div class="dash-insight-value" id="monthCount">—</div>
      <div class="dash-insight-detail" id="monthDetail">Calendar events</div>
    </div>
  </div>

  <div class="dash-main">
    <div class="dash-cal">
      <div class="dash-cal-title" id="calTitle">—</div>
      <div class="dash-cal-grid" id="calGrid"></div>
    </div>

    <div class="dash-agenda">
      <div class="dash-agenda-section today">
        <div class="dash-agenda-h">Today</div>
        <div class="dash-agenda-list" id="todayList"></div>
      </div>
      <div class="dash-agenda-section tomorrow">
        <div class="dash-agenda-h">Tomorrow</div>
        <div class="dash-agenda-list" id="tomorrowList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwvc7auhaAhbIXboJKxWoMCgELuJQxJFpnZzzt5stHXskigl3TJpXmkaXcxDqRJ4bp6Rw/exec';
const K_TOKEN = 'ledger-auth-token';
const REFRESH_MS = 5 * 60 * 1000;

let authToken = localStorage.getItem(K_TOKEN) || '';
let events = [];

function forceLogout(){
  localStorage.removeItem(K_TOKEN);
  authToken = '';
  document.getElementById('dash').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginError').textContent = 'Session expired — sign in again.';
}

async function attemptLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!username || !password){ errEl.textContent = 'Enter a username and password.'; return; }
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=login`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if(data.ok && data.token){
      authToken = data.token;
      localStorage.setItem(K_TOKEN, authToken);
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('dash').style.display = 'flex';
      start();
    } else {
      errEl.textContent = 'Incorrect username or password.';
    }
  }catch(err){
    errEl.textContent = 'Could not reach the server. Try again.';
  }
}

function wireLogin(){
  document.getElementById('loginBtn').addEventListener('click', attemptLogin);
  ['loginUser','loginPass'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
  });
}

const QUOTES = [
  {text:"The secret of getting ahead is getting started.", author:"Mark Twain"},
  {text:"It always seems impossible until it's done.", author:"Nelson Mandela"},
  {text:"Well done is better than well said.", author:"Benjamin Franklin"},
  {text:"The way to get started is to quit talking and begin doing.", author:"Walt Disney"},
  {text:"Don't watch the clock; do what it does. Keep going.", author:"Sam Levenson"},
  {text:"Success is the sum of small efforts repeated day in and day out.", author:"Robert Collier"},
  {text:"You don't have to be great to start, but you have to start to be great.", author:"Zig Ziglar"},
  {text:"Discipline is choosing between what you want now and what you want most.", author:"Abraham Lincoln"},
  {text:"Small daily improvements are the key to staggering long-term results.", author:"James Clear"},
  {text:"The future depends on what you do today.", author:"Mahatma Gandhi"},
  {text:"Do the hard jobs first. The easy jobs will take care of themselves.", author:"Dale Carnegie"},
  {text:"Motivation is what gets you started. Habit is what keeps you going.", author:"Jim Rohn"},
  {text:"Action is the foundational key to all success.", author:"Pablo Picasso"},
  {text:"A year from now you may wish you had started today.", author:"Karen Lamb"},
  {text:"Focus on being productive instead of busy.", author:"Tim Ferriss"},
  {text:"What we do today, right now, will have an accumulated effect on all our tomorrows.", author:"Alexandra Stoddard"},
  {text:"You don't need more time, you just need to decide.", author:"Seth Godin"},
  {text:"Amateurs sit and wait for inspiration; the rest of us just get up and go to work.", author:"Stephen King"},
  {text:"The pain of discipline weighs ounces; the pain of regret weighs tons.", author:"Jim Rohn"},
  {text:"We are what we repeatedly do. Excellence, then, is a habit.", author:"Will Durant"},
  {text:"Start where you are. Use what you have. Do what you can.", author:"Arthur Ashe"},
  {text:"Either you run the day, or the day runs you.", author:"Jim Rohn"},
  {text:"An investment in knowledge pays the best interest.", author:"Benjamin Franklin"},
  {text:"Simplicity is the ultimate sophistication.", author:"Leonardo da Vinci"},
  {text:"Quality is not an act, it is a habit.", author:"Aristotle"},
  {text:"The best time to plant a tree was 20 years ago. The second best time is now.", author:"Chinese Proverb"},
  {text:"Energy and persistence conquer all things.", author:"Benjamin Franklin"},
  {text:"He who has a why to live can bear almost any how.", author:"Friedrich Nietzsche"},
  {text:"Slow is smooth, and smooth is fast.", author:"Navy SEAL saying"},
  {text:"You miss 100% of the shots you don't take.", author:"Wayne Gretzky"},
  {text:"Progress, not perfection.", author:"Unknown"},
  {text:"Do something today that your future self will thank you for.", author:"Sean Patrick Flanery"},
  {text:"Whether you think you can or you think you can't, you're right.", author:"Henry Ford"},
  {text:"The only way to do great work is to love what you do.", author:"Steve Jobs"},
  {text:"Little by little, a little becomes a lot.", author:"Tanzanian Proverb"},
  {text:"Difficult roads often lead to beautiful destinations.", author:"Unknown"},
  {text:"Not all those who wander are lost.", author:"J.R.R. Tolkien"},
  {text:"Patience, persistence and perspiration make an unbeatable combination for success.", author:"Napoleon Hill"},
  {text:"You are never too old to set another goal or to dream a new dream.", author:"C.S. Lewis"},
];

function todaysQuote(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return QUOTES[dayOfYear % QUOTES.length];
}

function renderQuote(){
  const q = todaysQuote();
  document.getElementById('quoteBar').innerHTML =
    `“${escapeHtml(q.text)}”<span class="author">— ${escapeHtml(q.author)}</span>`;
}

function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function monthKeyOf(dateObj){ return dateObj.getFullYear()+'-'+pad(dateObj.getMonth()+1); }
function dateKeyOf(iso){ const d=new Date(iso); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function timeLabel(iso){
  return new Date(iso).toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit'});
}

function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit'});
  document.getElementById('dateLabel').textContent = now.toLocaleDateString('en-CA', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
}

async function fetchEvents(){
  const now = new Date();
  const month = monthKeyOf(now);
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=calendarEvents&month=${month}&token=${encodeURIComponent(authToken)}`);
    const data = await res.json();
    if(data.error === 'unauthorized'){ forceLogout(); return; }
    events = data.events || [];
  }catch(err){
    events = [];
  }
  renderCalendar();
  renderAgenda();
  renderInsights();
}

function renderInsights(){
  const now = new Date();
  const today = todayStr();
  const month = monthKeyOf(now);
  const todayEvents = events.filter(ev=>dateKeyOf(ev.start)===today);
  const monthEvents = events.filter(ev=>monthKeyOf(new Date(ev.start))===month);
  const timedToday = todayEvents.filter(ev=>!ev.allDay);
  const blockedMinutes = timedToday.reduce((total, ev)=>{
    const start = new Date(ev.start);
    const end = ev.end ? new Date(ev.end) : null;
    return total + (end && end > start ? Math.round((end - start) / 60000) : 0);
  }, 0);
  const upcoming = events
    .filter(ev=>!ev.allDay && new Date(ev.start) >= now)
    .sort((a,b)=>new Date(a.start)-new Date(b.start))[0];
  const duration = blockedMinutes >= 60
    ? `${Math.floor(blockedMinutes/60)}h${blockedMinutes%60 ? ` ${blockedMinutes%60}m` : ''}`
    : `${blockedMinutes}m`;

  document.getElementById('todayCount').textContent = `${todayEvents.length} ${todayEvents.length===1 ? 'event' : 'events'}`;
  document.getElementById('todayDetail').textContent = todayEvents.length ? 'Your schedule is ready' : 'Clear day ahead';
  document.getElementById('timeBlocked').textContent = timedToday.length ? duration : '0m';
  document.getElementById('timeBlockedDetail').textContent = timedToday.length ? `${timedToday.length} timed ${timedToday.length===1 ? 'event' : 'events'}` : 'No timed events today';
  document.getElementById('nextEvent').textContent = upcoming ? timeLabel(upcoming.start) : 'Clear';
  document.getElementById('nextEventDetail').textContent = upcoming ? upcoming.title : 'Nothing else scheduled';
  document.getElementById('monthCount').textContent = `${monthEvents.length} ${monthEvents.length===1 ? 'event' : 'events'}`;
  document.getElementById('monthDetail').textContent = now.toLocaleDateString('en-CA', {month:'long'}) + ' calendar';
}

function renderCalendar(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  document.getElementById('calTitle').textContent = now.toLocaleDateString('en-CA', {month:'long', year:'numeric'});

  const startWeekday = new Date(y, m, 1).getDay();
  const dim = new Date(y, m+1, 0).getDate();
  const today = todayStr();

  const byDay = {};
  events.forEach(ev=>{
    const key = dateKeyOf(ev.start);
    (byDay[key] = byDay[key] || []).push(ev);
  });

  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = weekdays.map(w=>`<div class="dash-weekday">${w}</div>`).join('');

  for(let i=0;i<startWeekday;i++) html += '<div class="dash-day empty"></div>';

  for(let d=1; d<=dim; d++){
    const dateStr = `${y}-${pad(m+1)}-${pad(d)}`;
    const dayEvents = (byDay[dateStr]||[]).sort((a,b)=> a.start.localeCompare(b.start));
    const shown = dayEvents.slice(0,3);
    const extra = dayEvents.length - shown.length;
    const pills = shown.map(ev=>{
      const label = ev.allDay ? ev.title : `${timeLabel(ev.start)} ${ev.title}`;
      return `<div class="dash-evt">${escapeHtml(label)}</div>`;
    }).join('');
    const cls = 'dash-day' + (dateStr===today ? ' today' : '');
    html += `<div class="${cls}">
      <div class="dash-day-num">${d}</div>
      <div class="dash-day-events">${pills}${extra>0?`<div class="dash-day-more">+${extra} more</div>`:''}</div>
    </div>`;
  }

  document.getElementById('calGrid').innerHTML = html;
}

function renderAgenda(){
  const today = todayStr();
  const tmrw = new Date(); tmrw.setDate(tmrw.getDate()+1);
  const tomorrowKey = tmrw.getFullYear()+'-'+pad(tmrw.getMonth()+1)+'-'+pad(tmrw.getDate());

  function buildList(dateKey, elId, cap){
    const list = events.filter(ev=>dateKeyOf(ev.start)===dateKey).sort((a,b)=> a.start.localeCompare(b.start));
    const el = document.getElementById(elId);
    if(list.length===0){ el.innerHTML = '<div class="dash-empty">Nothing scheduled.</div>'; return; }
    const shown = list.slice(0,cap);
    const extra = list.length - shown.length;
    el.innerHTML = shown.map(ev=>`
      <div class="dash-agenda-row">
        <span class="dash-agenda-time">${ev.allDay ? 'All day' : timeLabel(ev.start)}</span>
        <span class="dash-agenda-title">${escapeHtml(ev.title)}</span>
      </div>
    `).join('') + (extra>0 ? `<div class="dash-empty">+${extra} more</div>` : '');
  }

  buildList(today, 'todayList', 6);
  buildList(tomorrowKey, 'tomorrowList', 4);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function start(){
  updateClock();
  setInterval(updateClock, 1000);
  renderQuote();
  fetchEvents();
  setInterval(fetchEvents, REFRESH_MS);
}

wireLogin();
if(authToken){
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('dash').style.display = 'flex';
  start();
} else {
  document.getElementById('loginUser').focus();
}
</script>
</body>
</html>
