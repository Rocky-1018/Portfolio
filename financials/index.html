<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ledger — Expense Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#0F1417;
  --panel:#171F24;
  --panel-raised:#1D262C;
  --line:#2A343B;
  --ink:#E8EDF0;
  --muted:#8A98A3;
  --mint:#4FD1A5;
  --mint-dim:#2B4A42;
  --coral:#F2725A;
  --gold:#E3B341;
  --chart-income:#2FA37A;
  --chart-expense:#D9573D;
  --chart-leftover:#3987E5;
  --chart-other:#8A98A3;
  --chart-1:#3987E5;
  --chart-2:#D95926;
  --chart-3:#199E70;
  --chart-4:#C98500;
  --chart-5:#D55181;
  --chart-6:#008300;
  --chart-7:#9085E9;
  --chart-8:#E66767;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}

/* ---- Header ---- */
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
.topbar h1{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:22px;
  letter-spacing:0.2px;
  margin:0;
}
.topbar .sub{color:var(--muted);font-size:12.5px;}
.month-nav{display:flex;align-items:center;gap:10px;}
.month-nav-btn{
  background:var(--panel-raised);border:1px solid var(--line);color:var(--ink);
  width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:15px;
  line-height:1;display:flex;align-items:center;justify-content:center;
  font-family:inherit;
}
.month-nav-btn:hover{border-color:var(--mint);color:var(--mint);}
.month-nav .sub{min-width:112px;text-align:center;}

/* ---- Receipt / hero card ---- */
.receipt{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:26px 28px 22px;
  position:relative;
  margin-bottom:22px;
  overflow:hidden;
}
.receipt::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--line) 0 8px, transparent 8px 16px);
}
.receipt-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.6px;
  color:var(--muted);
  margin-bottom:10px;
}
.receipt-figure{
  font-family:'Fraunces',serif;
  font-weight:300;
  font-size:56px;
  line-height:1;
  color:var(--mint);
  letter-spacing:-1px;
  transition:transform .25s ease;
}
.receipt-figure.flash{transform:scale(1.04);}
.receipt-figure.negative{color:var(--coral);}
.receipt-meta{
  display:flex;
  gap:28px;
  margin-top:16px;
  flex-wrap:wrap;
}
.receipt-meta div{font-size:12.5px;color:var(--muted);}
.receipt-meta b{
  display:block;
  font-family:'JetBrains Mono',monospace;
  color:var(--ink);
  font-size:15px;
  margin-top:2px;
}

/* ---- Grid layout ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:800px){.grid{grid-template-columns:1fr;}}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:20px 22px;
  min-width:0;
}
.card h2{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--muted);
  margin:0 0 16px;
  font-weight:600;
}

/* ---- Quick add form ---- */
.form-row{display:flex;gap:10px;margin-bottom:10px;}
.field{flex:1;display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--muted);}
.field input, .field select{
  background:var(--panel-raised);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:6px;
  padding:9px 10px;
  font-size:14px;
  font-family:inherit;
  width:100%;
}
.field input:focus, .field select:focus{
  outline:none;
  border-color:var(--mint);
}
.amount-field input{font-family:'JetBrains Mono',monospace;}
.add-btn{
  width:100%;
  margin-top:6px;
  background:var(--mint);
  color:#0B1512;
  border:none;
  border-radius:6px;
  padding:11px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  transition:filter .15s ease;
}
.add-btn:hover{filter:brightness(1.08);}
.add-btn:active{filter:brightness(0.95);}
.hint{font-size:11px;color:var(--muted);margin-top:8px;}
.manage-link{
  background:none;border:none;color:var(--muted);
  font-size:11.5px;text-decoration:underline;
  cursor:pointer;padding:0;margin-top:10px;
  font-family:inherit;
}

/* ---- Transactions list ---- */
.tx-list{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.tx-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 4px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.tx-row:last-child{border-bottom:none;}
.tx-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tx-main{flex:1;min-width:0;}
.tx-desc{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-sub{color:var(--muted);font-size:11px;}
.tx-amount{font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.tx-amount.expense{color:var(--coral);}
.tx-amount.income{color:var(--mint);}
.tx-del{
  background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:15px;line-height:1;padding:4px 6px;
  border-radius:4px;
}
.tx-del:hover{color:var(--coral);background:rgba(242,114,90,0.1);}
.tx-empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}

/* ---- Donut chart (By category) ---- */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.donut-svg{flex-shrink:0;}
.donut-slice{cursor:pointer;transition:opacity .12s ease;}
.donut-slice.dim{opacity:0.35;}
.donut-center-total{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;fill:var(--ink);}
.donut-center-label{font-size:9.5px;fill:var(--muted);letter-spacing:0.4px;}
.donut-legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:9px;}
.donut-legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;}
.donut-legend-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.donut-legend-name{color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.donut-legend-pct{color:var(--muted);font-size:11px;width:36px;text-align:right;flex-shrink:0;}
.donut-legend-val{font-family:'JetBrains Mono',monospace;color:var(--muted);width:70px;text-align:right;flex-shrink:0;}
.donut-legend-row.dim{opacity:0.4;}

/* ---- Chart tooltip ---- */
.viz-tooltip{
  position:fixed;background:var(--panel-raised);border:1px solid var(--line);
  border-radius:6px;padding:7px 10px;font-size:11.5px;pointer-events:none;
  z-index:2000;opacity:0;transition:opacity .1s ease;white-space:nowrap;
}
.viz-tooltip.show{opacity:1;}
.viz-tooltip .tt-value{color:var(--ink);font-weight:700;font-family:'JetBrains Mono',monospace;display:block;font-size:13px;}
.viz-tooltip .tt-label{color:var(--muted);}

/* ---- Allocation ---- */
.alloc-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;}
.alloc-row .name{flex:0 0 150px;color:var(--ink);}
.alloc-row input[type=number]{
  width:56px;background:var(--panel-raised);border:1px solid var(--line);
  color:var(--ink);border-radius:5px;padding:5px 6px;font-size:12px;font-family:'JetBrains Mono',monospace;
}
.alloc-row .amt{flex:1;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--muted);}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel-raised);border:1px solid var(--mint);color:var(--ink);
  padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;
  transition:all .25s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.manage-panel{margin-top:12px;display:none;}
.manage-panel.open{display:block;}
.manage-row{display:flex;gap:8px;margin-bottom:6px;align-items:center;}
.manage-row input[type=text]{flex:1;}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--panel-raised);border:1px solid var(--line);
  border-radius:14px;padding:4px 10px;font-size:11.5px;margin:3px 4px 0 0;
}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0;}

/* ---- Monthly insights chart ---- */
.insights-card{grid-column:1 / -1;min-width:0;}
.insights-legend{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap;}
.insights-legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
.insights-legend-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.insights-legend-swatch.line{width:14px;height:2px;border-radius:1px;}
.insights-chart-scroll{overflow-x:auto;}
.chart-bar{cursor:pointer;}
.chart-bar-group:hover .chart-bar{opacity:0.85;}
.chart-axis-label{font-size:10px;fill:var(--muted);}
.chart-grid-line{stroke:var(--line);stroke-width:1;}
.chart-value-label{font-size:10px;fill:var(--muted);font-family:'JetBrains Mono',monospace;}
.chart-dot{cursor:pointer;}

/* ---- Calendar ---- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;}
.cal-weekday{font-size:10px;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:0.5px;}
.cal-day{
  background:var(--panel-raised);border:1px solid var(--line);border-radius:6px;
  min-height:74px;min-width:0;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;
  transition:border-color .12s ease;
}
.cal-day:hover{border-color:var(--mint);}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-day.today{border-color:var(--gold);}
.cal-day.selected{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint);}
.cal-day-num{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.cal-day.today .cal-day-num{color:var(--gold);font-weight:700;}
.cal-day-pills{display:flex;flex-direction:column;gap:2px;overflow:hidden;flex:1;}
.cal-pill{
  font-size:9.5px;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:'JetBrains Mono',monospace;
}
.cal-pill.expense{background:rgba(217,87,61,0.18);color:var(--coral);}
.cal-pill.income{background:rgba(47,163,122,0.18);color:var(--mint);}
.cal-day-more{font-size:9.5px;color:var(--muted);}
.cal-panel{border-top:1px solid var(--line);padding-top:16px;}
.cal-panel-header{font-family:'Fraunces',serif;font-size:15px;margin-bottom:10px;}
@media(max-width:640px){
  .cal-day{min-height:52px;padding:3px;}
  .cal-pill{font-size:8.5px;}
}

/* ---- Login ---- */
.login-overlay{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.login-card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:32px 30px;width:100%;max-width:340px;
}
.login-card h1{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 6px;}
.login-card p{color:var(--muted);font-size:12.5px;margin:0 0 20px;}
.login-card .field{margin-bottom:14px;}
.login-error{color:var(--coral);font-size:12.5px;margin-top:10px;min-height:16px;}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h1>Ledger</h1>
    <p>Sign in to continue.</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUser" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="add-btn" id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">

  <div class="topbar">
    <h1>Ledger</h1>
    <div class="month-nav">
      <button class="month-nav-btn" id="prevMonthBtn" aria-label="Previous month">‹</button>
      <div class="sub" id="periodLabel">—</div>
      <button class="month-nav-btn" id="nextMonthBtn" aria-label="Next month">›</button>
      <button class="manage-link" id="jumpTodayBtn" style="display:none;">this month</button>
      <button class="manage-link" id="logoutBtn">log out</button>
    </div>
  </div>

  <div class="receipt">
    <div class="receipt-label">Available to save / invest</div>
    <div class="receipt-figure" id="leftoverFigure">$0.00</div>
    <div class="receipt-meta">
      <div>Income<b id="metaIncome">$0</b></div>
      <div>Expenses<b id="metaExpense">$0</b></div>
    </div>
  </div>

  <div class="grid">

    <div class="card">
      <h2>Add transaction</h2>
      <div class="form-row">
        <div class="field">
          <label>Type</label>
          <select id="inType">
            <option value="expense" selected>Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="field amount-field">
          <label>Amount (CAD)</label>
          <input type="number" id="inAmount" placeholder="0.00" step="0.01">
        </div>
      </div>
      <div class="form-row" id="categoryRow">
        <div class="field">
          <label>Category</label>
          <select id="inCategory"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label id="descLabel">Description</label>
          <input type="text" id="inDesc" placeholder="e.g. groceries at Save-On">
        </div>
        <div class="field" style="max-width:150px;">
          <label>Date</label>
          <input type="date" id="inDate">
        </div>
      </div>
      <div class="form-row" id="recurringRow">
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;">
          <input type="checkbox" id="inRecurring" style="width:auto;">
          Repeat every month (fixed expense)
        </label>
      </div>
      <button class="add-btn" id="addBtn">Add expense</button>
      <div class="hint">Press Enter in any field to add instantly.</div>
      <button class="manage-link" id="toggleManage">Manage categories</button>
      <div class="manage-panel" id="managePanel">
        <div class="manage-row">
          <input type="text" id="newCatName" placeholder="New category name">
          <button class="add-btn" style="width:auto;padding:8px 12px;" id="addCatBtn">Add</button>
        </div>
        <div id="catChips"></div>
      </div>
      <button class="manage-link" id="toggleRecurringManage">Manage fixed expenses</button>
      <div class="manage-panel" id="recurringPanel">
        <div id="recurringChips"></div>
      </div>
    </div>

    <div class="card">
      <h2>Transactions this month</h2>
      <div class="tx-list" id="txList"></div>
    </div>

    <div class="card insights-card">
      <h2>Calendar</h2>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-panel" id="calDayPanel"></div>
    </div>

    <div class="card">
      <h2>By category</h2>
      <div id="catBreakdown"></div>
    </div>

    <div class="card">
      <h2>Allocate the leftover</h2>
      <div id="allocRows"></div>
      <div class="hint" id="allocCheck"></div>
      <div class="manage-row" style="margin-top:14px;">
        <input type="text" id="newAllocName" placeholder="New allocation name">
        <button class="add-btn" style="width:auto;padding:8px 12px;" id="addAllocBtn">Add</button>
      </div>
    </div>

    <div class="card insights-card">
      <h2>Monthly insights</h2>
      <div id="monthlyInsights"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<div class="viz-tooltip" id="vizTooltip"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwvc7auhaAhbIXboJKxWoMCgELuJQxJFpnZzzt5stHXskigl3TJpXmkaXcxDqRJ4bp6Rw/exec';
const K_TOKEN = 'ledger-auth-token';

let authToken = localStorage.getItem(K_TOKEN) || '';

window.storage = {
  async get(key){
    const res = await fetch(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(key)}&token=${encodeURIComponent(authToken)}`);
    const data = await res.json();
    if(data.error === 'unauthorized'){ forceLogout(); return null; }
    if(data.value === null || data.value === undefined) return null;
    return { value: data.value };
  },
  async getAll(){
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getAll&token=${encodeURIComponent(authToken)}`);
    const data = await res.json();
    if(data.error === 'unauthorized'){ forceLogout(); return null; }
    return data;
  },
  async set(key, value){
    const res = await fetch(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(key)}&token=${encodeURIComponent(authToken)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: value
    });
    const data = await res.json();
    if(data.error === 'unauthorized'){ forceLogout(); }
  }
};

function forceLogout(){
  localStorage.removeItem(K_TOKEN);
  authToken = '';
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginError').textContent = 'Session expired — sign in again.';
}

async function attemptLogin(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!username || !password){ errEl.textContent = 'Enter a username and password.'; return; }
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=login`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if(data.ok && data.token){
      authToken = data.token;
      localStorage.setItem(K_TOKEN, authToken);
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appWrap').style.display = 'block';
      await init();
    } else {
      errEl.textContent = 'Incorrect username or password.';
    }
  }catch(err){
    errEl.textContent = 'Could not reach the server. Try again.';
  }
}

function wireLogin(){
  document.getElementById('loginBtn').addEventListener('click', attemptLogin);
  ['loginUser','loginPass'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
  });
  document.getElementById('logoutBtn').addEventListener('click', forceLogout);
}

const K_EXPENSES = 'expenses-v1';
const K_INCOME = 'income-v1';
const K_CATEGORIES = 'categories-v1';
const K_ALLOC = 'allocation-v1';
const K_RECURRING = 'recurring-v1';

const CAT_COLORS = ['#3987E5','#D95926','#199E70','#C98500','#D55181','#008300','#9085E9','#E66767'];
const CHART_INCOME = '#2FA37A';
const CHART_EXPENSE = '#D9573D';
const CHART_LEFTOVER = '#3987E5';
const CHART_OTHER = '#8A98A3';
const CHART_PANEL = '#171F24';

let expenses = [];
let income = [];
let categories = [];
let recurring = [];
let allocation = [];
let selectedMonth = monthKey(todayStr());
let selectedCalDay = null;

function money(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-CA', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function moneyShort(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.round(Math.abs(n)).toLocaleString('en-CA');
}
// SVG path for a bar with rounded top corners and a square baseline
function roundedTopBarPath(x, w, baseline, barH, r){
  const yTop = baseline - barH;
  if(barH <= 0.5) return `M ${x} ${baseline} L ${x+w} ${baseline}`;
  const rr = Math.min(r, w/2, barH);
  if(rr <= 0.5) return `M ${x} ${baseline} L ${x} ${yTop} L ${x+w} ${yTop} L ${x+w} ${baseline} Z`;
  return `M ${x} ${baseline} L ${x} ${yTop+rr} Q ${x} ${yTop} ${x+rr} ${yTop} L ${x+w-rr} ${yTop} Q ${x+w} ${yTop} ${x+w} ${yTop+rr} L ${x+w} ${baseline} Z`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function showTooltip(evt, label, value){
  const tip = document.getElementById('vizTooltip');
  tip.innerHTML = '';
  const valueEl = document.createElement('span');
  valueEl.className = 'tt-value';
  valueEl.textContent = value;
  const labelEl = document.createElement('span');
  labelEl.className = 'tt-label';
  labelEl.textContent = label;
  tip.appendChild(valueEl);
  tip.appendChild(labelEl);
  tip.classList.add('show');
  moveTooltip(evt);
}
function moveTooltip(evt){
  const tip = document.getElementById('vizTooltip');
  const x = evt.clientX, y = evt.clientY;
  const offX = x > window.innerWidth - 160 ? -170 : 14;
  const offY = y > window.innerHeight - 80 ? -50 : 14;
  tip.style.left = (x + offX) + 'px';
  tip.style.top = (y + offY) + 'px';
}
function hideTooltip(){
  document.getElementById('vizTooltip').classList.remove('show');
}

async function loadAll(){
  let bundle = null;
  let fetchOk = true;
  try{
    bundle = await window.storage.getAll();
  }catch(err){ fetchOk = false; }
  if(!bundle) fetchOk = false;
  bundle = bundle || {};

  try{
    expenses = bundle.expenses ? JSON.parse(bundle.expenses) : [];
  }catch(err){ expenses = []; }

  try{
    income = bundle.income ? JSON.parse(bundle.income) : [];
  }catch(err){ income = []; }

  try{
    categories = bundle.categories ? JSON.parse(bundle.categories) : [];
  }catch(err){ categories = []; }

  try{
    if(bundle.allocation) allocation = JSON.parse(bundle.allocation);
  }catch(err){}

  try{
    recurring = bundle.recurring ? JSON.parse(bundle.recurring) : [];
  }catch(err){ recurring = []; }

  if(!fetchOk){
    showToast('Could not load your saved data — check your connection and reload.');
  }
}

// creates this month's occurrence of each fixed expense the first time the app
// is opened in a new calendar month; a deleted occurrence won't reappear until
// the following month, since lastGeneratedMonth is only updated once per cycle
async function applyRecurring(){
  const cm = monthKey(todayStr());
  const dim = daysInMonthOf(cm);
  let expensesChanged = false;
  let recurringChanged = false;
  recurring.forEach(t=>{
    if(t.lastGeneratedMonth !== cm){
      const day = Math.min(Math.max(Number(t.day)||1, 1), dim);
      const date = cm + '-' + String(day).padStart(2,'0');
      expenses.push({id:cryptoId(), date, category:t.category, desc:t.desc, amount:t.amount, recurringId:t.id});
      t.lastGeneratedMonth = cm;
      expensesChanged = true;
      recurringChanged = true;
    }
  });
  if(expensesChanged) await window.storage.set(K_EXPENSES, JSON.stringify(expenses));
  if(recurringChanged) await window.storage.set(K_RECURRING, JSON.stringify(recurring));
}

function cryptoId(){ return 'x' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function catColor(name){
  const idx = categories.indexOf(name);
  return CAT_COLORS[(idx>=0?idx:0) % CAT_COLORS.length];
}

function isSelectedMonth(dateStr){
  if(!dateStr) return false;
  return monthKey(dateStr) === selectedMonth;
}

function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function monthLabel(key){
  const parts = key.split('-');
  const d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
  return d.toLocaleDateString('en-CA', {month:'short', year:'numeric'});
}
function monthLabelLong(key){
  const parts = key.split('-');
  const d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
  return d.toLocaleDateString('en-CA', {month:'long', year:'numeric'});
}
function shiftMonth(key, delta){
  const parts = key.split('-');
  const d = new Date(Number(parts[0]), Number(parts[1])-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function daysInMonthOf(key){
  const parts = key.split('-');
  return new Date(Number(parts[0]), Number(parts[1]), 0).getDate();
}

  const incRows = income.filter(i=>isSelectedMonth(i.date)).map(i=>({...i, kind:'income'}));

    const sub = isExpense ? `${tx.category}${tx.recurringId ? ' · Fixed' : ''} · ${tx.date}` : tx.date;
    const desc = tx.desc || (isExpense ? tx.category : 'Income');

async function deleteTx(kind, id){
  if(kind==='expense'){
    expenses = expenses.filter(e=>e.id !== id);
    await window.storage.set(K_EXPENSES, JSON.stringify(expenses));
  } else {
    income = income.filter(i=>i.id !== id);
    await window.storage.set(K_INCOME, JSON.stringify(income));
  }
  renderAll();
  showToast('Removed');
}

function renderCalendar(){
  const grid = document.getElementById('calGrid');
  const [y, m] = selectedMonth.split('-').map(Number);
  const startWeekday = new Date(y, m-1, 1).getDay();
  const dim = daysInMonthOf(selectedMonth);

  const dayTx = {};
  expenses.filter(e=>isSelectedMonth(e.date)).forEach(e=>{
    const day = Number(e.date.slice(8,10));
    (dayTx[day] = dayTx[day] || []).push({...e, kind:'expense'});
  });
  income.filter(i=>isSelectedMonth(i.date)).forEach(i=>{
    const day = Number(i.date.slice(8,10));
    (dayTx[day] = dayTx[day] || []).push({...i, kind:'income'});
  });

  const today = todayStr();
  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = weekdays.map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  for(let i=0; i<startWeekday; i++) html += '<div class="cal-day empty"></div>';

  for(let d=1; d<=dim; d++){
    const dateStr = selectedMonth + '-' + String(d).padStart(2,'0');
    const txs = (dayTx[d]||[]).sort((a,b)=> a.kind==='income' ? -1 : 1);
    const shown = txs.slice(0,2);
    const extra = txs.length - shown.length;
    const pills = shown.map(tx=>{
      const label = (tx.kind==='income' ? '+' : '-') + moneyShort(tx.amount);
      return `<div class="cal-pill ${tx.kind}">${label}</div>`;
    }).join('');
    const classes = ['cal-day'];
    if(dateStr === today) classes.push('today');
    if(dateStr === selectedCalDay) classes.push('selected');
    html += `<div class="${classes.join(' ')}" data-date="${dateStr}">
      <div class="cal-day-num">${d}</div>
      <div class="cal-day-pills">${pills}${extra>0 ? `<div class="cal-day-more">+${extra} more</div>` : ''}</div>
    </div>`;
  }

  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day:not(.empty)').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      selectedCalDay = cell.dataset.date;
      renderCalendar();
    });
  });

  renderCalDayPanel();
}

function renderMonthlyInsights(){
  const el = document.getElementById('monthlyInsights');
  const map = {};
  income.forEach(i=>{
    const k = monthKey(i.date);
    if(!k) return;
    map[k] = map[k] || {income:0, expense:0};
    map[k].income += Number(i.amount);
  });
  expenses.forEach(e=>{
    const k = monthKey(e.date);
    if(!k) return;
    map[k] = map[k] || {income:0, expense:0};
    map[k].expense += Number(e.amount);
  });

  const keys = Object.keys(map).sort().slice(-6);
  if(keys.length===0){
    el.innerHTML = '<div class="tx-empty">No income or expenses yet — add some to see monthly insights.</div>';
    return;
  }

  const rows = keys.map(k=>({
    key: k,
    label: monthLabel(k),
    income: map[k].income,
    expense: map[k].expense,
    leftover: map[k].income - map[k].expense,
  }));

  const maxVal = Math.max(1, ...rows.map(r=>Math.max(r.income, r.expense, r.leftover)));
  const minVal = Math.min(0, ...rows.map(r=>r.leftover));
  const domain = Math.max(1, maxVal - minVal);

  const PAD_TOP = 14, PLOT_H = 180, PAD_BOTTOM = 26, PAD_LEFT = 56, GROUP_W = 84;
  const width = PAD_LEFT + rows.length * GROUP_W + 54;
  const height = PAD_TOP + PLOT_H + PAD_BOTTOM;
  const yScale = v => PAD_TOP + PLOT_H * (1 - (v - minVal) / domain);
  const zeroY = yScale(0);

  const rawStep = domain / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
  const norm = rawStep / mag;
  const niceNorm = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  const step = niceNorm * mag;
  const ticks = [];
  for(let t = Math.ceil(minVal/step)*step; t <= maxVal + 0.001; t += step) ticks.push(Math.round(t));
  if(!ticks.includes(0) && minVal <= 0 && maxVal >= 0) ticks.push(0);

  let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;

  ticks.forEach(tv=>{
    const y = yScale(tv);
    svg += `<line class="chart-grid-line" x1="${PAD_LEFT}" y1="${y}" x2="${width-10}" y2="${y}"/>`;
    svg += `<text class="chart-axis-label" x="${PAD_LEFT-8}" y="${y+3}" text-anchor="end">${moneyShort(tv)}</text>`;
  });

  const barW = 20, barGap = 4, pairW = barW*2 + barGap;
  const linePoints = [];

  rows.forEach((r,i)=>{
    const groupCenter = PAD_LEFT + i*GROUP_W + GROUP_W/2;
    const incX = groupCenter - pairW/2;
    const expX = incX + barW + barGap;
    const incH = zeroY - yScale(r.income);
    const expH = zeroY - yScale(r.expense);

    svg += `<g class="chart-bar-group">
      <path class="chart-bar" data-i="${i}" data-series="income" fill="${CHART_INCOME}" d="${roundedTopBarPath(incX, barW, zeroY, incH, 4)}"/>
      <path class="chart-bar" data-i="${i}" data-series="expense" fill="${CHART_EXPENSE}" d="${roundedTopBarPath(expX, barW, zeroY, expH, 4)}"/>
    </g>`;
    svg += `<text class="chart-axis-label" x="${groupCenter}" y="${height-8}" text-anchor="middle">${r.label}</text>`;

    linePoints.push({x:groupCenter, y:yScale(r.leftover)});
  });

  if(linePoints.length > 1){
    const pathD = linePoints.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
    svg += `<path d="${pathD}" fill="none" stroke="${CHART_LEFTOVER}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  linePoints.forEach((p,i)=>{
    svg += `<circle class="chart-dot" data-i="${i}" cx="${p.x}" cy="${p.y}" r="4" fill="${CHART_LEFTOVER}" stroke="${CHART_PANEL}" stroke-width="2"/>`;
  });

  const last = rows[rows.length-1];
  const lastCenter = PAD_LEFT + (rows.length-1)*GROUP_W + GROUP_W/2;
  const lastDotY = yScale(last.leftover);
  svg += `<text class="chart-value-label" x="${lastCenter + pairW/2 + 10}" y="${lastDotY+4}" text-anchor="start" fill="${CHART_LEFTOVER}">${moneyShort(last.leftover)}</text>`;

  svg += `</svg>`;

  el.innerHTML = `
    <div class="insights-legend">
      <span class="insights-legend-item"><span class="insights-legend-swatch" style="background:${CHART_INCOME}"></span>Income</span>
      <span class="insights-legend-item"><span class="insights-legend-swatch" style="background:${CHART_EXPENSE}"></span>Expenses</span>
      <span class="insights-legend-item"><span class="insights-legend-swatch line" style="background:${CHART_LEFTOVER}"></span>Leftover</span>
    </div>
    <div class="insights-chart-scroll">${svg}</div>`;

  el.querySelectorAll('.chart-bar').forEach(bar=>{
    const i = Number(bar.dataset.i);
    const series = bar.dataset.series;
    const r = rows[i];
    const val = series==='income' ? r.income : r.expense;
    bar.addEventListener('pointerenter', ev=> showTooltip(ev, r.label + ' · ' + (series==='income'?'Income':'Expenses'), money(val)));
    bar.addEventListener('pointermove', moveTooltip);
    bar.addEventListener('pointerleave', hideTooltip);
  });
  el.querySelectorAll('.chart-dot').forEach(dot=>{
    const i = Number(dot.dataset.i);
    const r = rows[i];
    dot.addEventListener('pointerenter', ev=> showTooltip(ev, r.label + ' · Leftover', money(r.leftover)));
    dot.addEventListener('pointermove', moveTooltip);
    dot.addEventListener('pointerleave', hideTooltip);
  });
}

function renderCatBreakdown(){
  const el = document.getElementById('catBreakdown');
  const monthExpenses = expenses.filter(e=>isSelectedMonth(e.date));
  const totalsMap = {};
  monthExpenses.forEach(e=>{ totalsMap[e.category] = (totalsMap[e.category]||0) + Number(e.amount); });

  let entries = Object.keys(totalsMap)
    .filter(name=>totalsMap[name] > 0)
    .map(name=>({name, amount:totalsMap[name], color:catColor(name)}))
    .sort((a,b)=> b.amount - a.amount);

  if(entries.length === 0){
    el.innerHTML = `<div class="tx-empty">No expenses in ${monthLabelLong(selectedMonth)} yet.</div>`;
    return;
  }

  if(entries.length > 6){
    const top = entries.slice(0,5);
    const restTotal = entries.slice(5).reduce((s,e)=>s+e.amount,0);
    entries = [...top, {name:'Other', amount:restTotal, color:CHART_OTHER}];
  }

  const total = entries.reduce((s,e)=>s+e.amount,0);
  const R = 62, CX = 85, CY = 85, SW = 20, GAP = 3;
  const circumference = 2 * Math.PI * R;
  let cumulative = 0;

  const slices = entries.map((e,i)=>{
    const frac = e.amount / total;
    const segLen = Math.max(0, frac * circumference - GAP);
    const dashOffset = -cumulative;
    cumulative += frac * circumference;
    return `<circle class="donut-slice" data-idx="${i}" cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${e.color}" stroke-width="${SW}" stroke-dasharray="${segLen} ${circumference-segLen}" stroke-dashoffset="${dashOffset}"/>`;
  }).join('');

  const svg = `
    <svg class="donut-svg" width="170" height="170" viewBox="0 0 170 170">
      <g transform="rotate(-90 ${CX} ${CY})">${slices}</g>
      <text class="donut-center-total" x="${CX}" y="${CY-2}" text-anchor="middle">${moneyShort(total)}</text>
      <text class="donut-center-label" x="${CX}" y="${CY+14}" text-anchor="middle">spent this month</text>
    </svg>`;

  const legend = entries.map((e,i)=>{
    const pct = Math.round((e.amount/total)*100);
    return `
      <div class="donut-legend-row" data-idx="${i}">
        <span class="donut-legend-swatch" style="background:${e.color}"></span>
        <span class="donut-legend-name">${e.name}</span>
        <span class="donut-legend-pct">${pct}%</span>
        <span class="donut-legend-val">${money(e.amount)}</span>
      </div>`;
  }).join('');

  el.innerHTML = `<div class="donut-wrap">${svg}<div class="donut-legend">${legend}</div></div>`;

  const sliceEls = el.querySelectorAll('.donut-slice');
  const legendEls = el.querySelectorAll('.donut-legend-row');
  function setDim(idx){
    sliceEls.forEach(s=> s.classList.toggle('dim', idx!==null && Number(s.dataset.idx)!==idx));
    legendEls.forEach(l=> l.classList.toggle('dim', idx!==null && Number(l.dataset.idx)!==idx));
  }
  function wireHover(elList){
    elList.forEach(node=>{
      const idx = Number(node.dataset.idx);
      const e = entries[idx];
      const pct = Math.round((e.amount/total)*100);
      node.addEventListener('pointerenter', ev=>{ setDim(idx); showTooltip(ev, e.name, money(e.amount) + ' · ' + pct + '%'); });
      node.addEventListener('pointermove', moveTooltip);
      node.addEventListener('pointerleave', ()=>{ setDim(null); hideTooltip(); });
    });
  }
  wireHover(sliceEls);
  wireHover(legendEls);
}

function computeTotals(){
  const monthExpenses = expenses.filter(e=>isSelectedMonth(e.date));
  const monthIncome = income.filter(i=>isSelectedMonth(i.date));
  const expenseTotal = monthExpenses.reduce((s,e)=>s+Number(e.amount), 0);
  const incomeTotal = monthIncome.reduce((s,i)=>s+Number(i.amount), 0);
  const leftover = incomeTotal - expenseTotal;
  return {income: incomeTotal, expense: expenseTotal, leftover};
}

function renderHero(prevLeftover){
  const {income, expense, leftover} = computeTotals();
  const fig = document.getElementById('leftoverFigure');
  fig.textContent = money(leftover);
  fig.classList.toggle('negative', leftover < 0);
  if(prevLeftover !== undefined && prevLeftover !== leftover){
    fig.classList.add('flash');
    setTimeout(()=>fig.classList.remove('flash'), 250);
  }
  document.getElementById('metaIncome').textContent = money(income);
  document.getElementById('metaExpense').textContent = money(expense);

  const label = document.getElementById('periodLabel');
  label.textContent = monthLabelLong(selectedMonth);

  const isCurrent = selectedMonth === monthKey(todayStr());
  document.getElementById('jumpTodayBtn').style.display = isCurrent ? 'none' : 'inline';
}

function renderAllocation(){
  const {leftover} = computeTotals();
  const el = document.getElementById('allocRows');
  const checkEl = document.getElementById('allocCheck');

  if(allocation.length === 0){
    el.innerHTML = '<div class="tx-empty">No allocations yet — add one below.</div>';
    checkEl.textContent = '';
    return;
  }

  el.innerHTML = allocation.map((a,i)=>`
    <div class="alloc-row">
      <span class="name">${a.name}</span>
      <input type="number" min="0" max="100" step="1" value="${Math.round(a.pct*100)}" data-idx="${i}" class="alloc-pct">
      <span style="color:var(--muted)">%</span>
      <span class="amt">${money(leftover*a.pct)}</span>
      <button class="tx-del alloc-del" data-idx="${i}">×</button>
    </div>
  `).join('');
  el.querySelectorAll('.alloc-pct').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const idx = Number(inp.dataset.idx);
      allocation[idx].pct = Number(inp.value)/100;
      await window.storage.set(K_ALLOC, JSON.stringify(allocation));
      renderAllocation();
    });
  });
  el.querySelectorAll('.alloc-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.idx);
      allocation.splice(idx,1);
      await window.storage.set(K_ALLOC, JSON.stringify(allocation));
      renderAllocation();
      showToast('Allocation removed');
    });
  });
  const totalPct = allocation.reduce((s,a)=>s+a.pct,0);
  const pctRounded = Math.round(totalPct*100);
  checkEl.textContent = pctRounded === 100 ? 'Allocations total 100% ✓' : `Allocations total ${pctRounded}% — adjust to reach 100%`;
  checkEl.style.color = pctRounded===100 ? 'var(--mint)' : 'var(--coral)';
}

let lastLeftover;
function renderAll(){
  renderTxList();
  renderCalendar();
  renderCatBreakdown();
  renderMonthlyInsights();
  renderHero(lastLeftover);
  lastLeftover = computeTotals().leftover;
  renderAllocation();
}

function updateTypeUI(){
  const type = document.getElementById('inType').value;
  const isExpense = type === 'expense';
  document.getElementById('categoryRow').style.display = isExpense ? 'flex' : 'none';
  document.getElementById('recurringRow').style.display = isExpense ? 'flex' : 'none';
  document.getElementById('descLabel').textContent = isExpense ? 'Description' : 'Source';
  document.getElementById('inDesc').placeholder = isExpense ? 'e.g. groceries at Save-On' : 'e.g. paycheck, freelance';
  document.getElementById('addBtn').textContent = isExpense ? 'Add expense' : 'Add income';
}

// shared by the main "Add transaction" form and the calendar day panel
async function submitTransaction({type, amount, category, desc, date, isRecurring}){
  if(!amount || amount<=0){ showToast('Enter an amount first'); return false; }

  if(type === 'expense'){
    if(!category){ showToast('Add a category first'); return false; }
    if(isRecurring){
      const day = Number(date.slice(8,10));
      const template = {id:cryptoId(), category, desc, amount, day, lastGeneratedMonth: monthKey(date)};
      recurring.push(template);
      await window.storage.set(K_RECURRING, JSON.stringify(recurring));
      expenses.push({id:cryptoId(), date, category, desc, amount, recurringId:template.id});
      await window.storage.set(K_EXPENSES, JSON.stringify(expenses));
      renderRecurringChips();
      showToast('Added ' + money(amount) + ' fixed expense — repeats monthly');
    } else {
      expenses.push({id:cryptoId(), date, category, desc, amount});
      await window.storage.set(K_EXPENSES, JSON.stringify(expenses));
      showToast('Added ' + money(amount) + ' to ' + category);
    }
  } else {
    income.push({id:cryptoId(), date, desc, amount});
    await window.storage.set(K_INCOME, JSON.stringify(income));
    showToast('Added ' + money(amount) + ' income');
  }

  renderAll();
  return true;
}

async function addTransaction(){
  const type = document.getElementById('inType').value;
  const amount = Number(document.getElementById('inAmount').value);
  const category = document.getElementById('inCategory').value;
  const desc = document.getElementById('inDesc').value.trim();
  const date = document.getElementById('inDate').value || todayStr();
  const isRecurring = document.getElementById('inRecurring').checked;

  const ok = await submitTransaction({type, amount, category, desc, date, isRecurring});
  if(ok){
    document.getElementById('inAmount').value = '';
    document.getElementById('inDesc').value = '';
    document.getElementById('inRecurring').checked = false;
  }
}

function wireEvents(){
  document.getElementById('inType').addEventListener('change', updateTypeUI);
  document.getElementById('addBtn').addEventListener('click', addTransaction);
  ['inAmount','inDesc'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') addTransaction(); });
  });

  document.getElementById('toggleManage').addEventListener('click', ()=>{
    document.getElementById('managePanel').classList.toggle('open');
  });
  document.getElementById('addCatBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('newCatName').value.trim();
    if(!name){ showToast('Name the category first'); return; }
    categories.push(name);
    await window.storage.set(K_CATEGORIES, JSON.stringify(categories));
    document.getElementById('newCatName').value='';
    renderCategorySelect(); renderCatChips(); renderAll();
    showToast('Category added');
  });

  document.getElementById('toggleRecurringManage').addEventListener('click', ()=>{
    document.getElementById('recurringPanel').classList.toggle('open');
  });

  document.getElementById('addAllocBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('newAllocName').value.trim();
    if(!name){ showToast('Name the allocation first'); return; }
    allocation.push({name, pct:0});
    await window.storage.set(K_ALLOC, JSON.stringify(allocation));
    document.getElementById('newAllocName').value = '';
    renderAllocation();
    showToast('Allocation added');
  });
  document.getElementById('newAllocName').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('addAllocBtn').click();
  });

  document.getElementById('prevMonthBtn').addEventListener('click', ()=>{
    selectedMonth = shiftMonth(selectedMonth, -1);
    selectedCalDay = null;
    renderAll();
  });
  document.getElementById('nextMonthBtn').addEventListener('click', ()=>{
    selectedMonth = shiftMonth(selectedMonth, 1);
    selectedCalDay = null;
    renderAll();
  });
  document.getElementById('jumpTodayBtn').addEventListener('click', ()=>{
    selectedMonth = monthKey(todayStr());
    selectedCalDay = null;
    renderAll();
  });
}

async function init(){
  await loadAll();
  await applyRecurring();
  renderCategorySelect();
  renderCatChips();
  renderRecurringChips();
  document.getElementById('inDate').value = todayStr();
  updateTypeUI();
  wireEvents();
  renderAll();
}

wireLogin();
if(authToken){
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  init();
} else {
  document.getElementById('loginUser').focus();
}
</script>
</body>
</html>
